<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="theme-color" content="#141414">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>넷플릭스 검색기</title>
<style>
:root{--bg:#141414;--card:#1f1f1f;--text:#f2f2f2;--sub:#9a9a9a;--red:#e50914;--line:#333}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Malgun Gothic",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(20,20,20,.97);padding:10px 14px;border-bottom:1px solid var(--line)}
h1{margin:0 0 8px;font-size:18px;color:var(--red);display:flex;justify-content:space-between;align-items:center}
h1 button{font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
input,select,button{background:#2a2a2a;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
input[type=search]{flex:1;min-width:140px}
button{cursor:pointer}
button.on{background:var(--red);border-color:var(--red)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chips button{white-space:nowrap;padding:5px 11px;border-radius:99px;font-size:13px}
main{padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{background:var(--card);border-radius:8px;overflow:hidden;cursor:pointer;position:relative}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#333}
.card .t{padding:6px 8px 8px;font-size:13px}
.card .m{color:var(--sub);font-size:12px;margin-top:2px}
.badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.75);border-radius:6px;padding:2px 6px;font-size:12px}
.mark{position:absolute;top:6px;right:6px;font-size:16px}
.more{display:block;margin:18px auto;padding:10px 28px}
.msg{text-align:center;color:var(--sub);padding:40px 10px;line-height:1.7}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;z-index:10;overflow:auto}
.modal.show{display:block}
.sheet{max-width:640px;margin:20px auto;background:var(--card);border-radius:12px;overflow:hidden}
.sheet img.bd{width:100%;display:block}
.sheet .b{padding:14px}
.sheet h2{margin:0 0 4px}
.sheet p{line-height:1.6;color:#ddd;font-size:14px}
.sheet a.btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;padding:9px 16px;border-radius:8px;margin:4px 6px 4px 0}
.sheet button.btn2{margin:4px 6px 4px 0}
label{font-size:13px;color:var(--sub)}
.setup{max-width:520px;margin:30px auto;line-height:1.7}
.setup input{width:100%;margin:8px 0}
.setup a{color:#6cf}
</style>
</head>
<body>
<header>
  <h1>🎬 넷플릭스 검색기 <button id="keyBtn">⚙ 키</button></h1>
  <div class="row">
    <button id="tMovie" class="on">영화</button>
    <button id="tTv">드라마·시리즈</button>
    <button id="tMine">⭐ 내 목록</button>
    <input type="search" id="q" placeholder="제목 검색 (넷플릭스에 있는 것만)">
  </div>
  <div class="row">
    <select id="sort">
      <option value="popularity.desc">인기순</option>
      <option value="vote_average.desc">평점순</option>
      <option value="date.desc">최신순 (영화: 개봉일 / 드라마: 최근 방영)</option>
      <option value="vote_count.desc">평가 많은순</option>
    </select>
    <select id="rate">
      <option value="0">평점 전체</option>
      <option value="6">6점 이상</option>
      <option value="7">7점 이상</option>
      <option value="8">8점 이상</option>
    </select>
    <select id="origin">
      <option value="">전 세계</option>
      <option value="KR">한국 작품</option>
      <option value="US">미국</option>
      <option value="JP">일본</option>
      <option value="GB">영국</option>
    </select>
    <select id="hide"><option value="0">전부 보기</option><option value="1">본 것 숨기기</option></select>
  </div>
  <div class="row"><div class="chips" id="genres" style="width:100%"></div></div>
</header>
<main id="main"></main>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const $=s=>document.querySelector(s);
const API='https://api.themoviedb.org/3', IMG='https://image.tmdb.org/t/p/';
const NETFLIX=8, REGION='KR';
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let wkey=store.get('wkey','');
let key=store.get('key',''), type='movie', page=1, total=1, sel=new Set(), items=[], genreCache={};
let mine=store.get('mine',{}); // "movie:123": {s:'want'|'seen', t,p,y,r}

function hdr(){return key.startsWith('eyJ')?{headers:{Authorization:'Bearer '+key}}:{}}
const mem=new Map();
async function tmdb(path,params={}){
  const u=new URL(API+path);
  Object.entries({language:'ko-KR',...params}).forEach(([k,v])=>v!==''&&v!=null&&u.searchParams.set(k,v));
  const ck=u.toString(), ttl=path.includes('/watch/providers')?864e5:path.startsWith('/genre')?864e5*7:6e5;
  const hit=mem.get(ck)||store.get('c:'+ck,null);
  if(hit&&Date.now()-hit.t<ttl){mem.set(ck,hit);return hit.d}
  if(!key.startsWith('eyJ'))u.searchParams.set('api_key',key);
  const r=await fetch(u,hdr());
  if(!r.ok)throw new Error(r.status==401?'API 키가 올바르지 않습니다':'요청 실패 '+r.status);
  const d=await r.json(), rec={t:Date.now(),d};
  mem.set(ck,rec);
  if(path.includes('/watch/providers')||path.startsWith('/genre'))store.set('c:'+ck,rec);
  return d;
}

function showSetup(){
  $('#main').innerHTML=`<div class="setup"><h2>처음 한 번만 설정</h2>
  <p>넷플릭스는 공개 API가 없어서, 무료 영화 DB인 <b>TMDB</b>의 데이터로 "한국 넷플릭스에 있는 작품"만 걸러 보여줍니다.</p>
  <ol><li><a href="https://www.themoviedb.org/signup" target="_blank">TMDB 무료 가입</a></li>
  <li><a href="https://www.themoviedb.org/settings/api" target="_blank">설정 → API</a>에서 개인용(Personal) 신청 후 <b>API 키</b>(또는 API 읽기 액세스 토큰)를 복사</li>
  <li>아래에 붙여넣기 (이 기기 브라우저에만 저장됩니다)</li></ol>
  <input id="keyIn" placeholder="TMDB API 키 붙여넣기" value="${key}">
  <p style="margin:12px 0 0">(선택) <a href="https://api.watchmode.com" target="_blank">Watchmode</a> 무료 키를 넣으면 넷플릭스 앱의 작품 화면으로 바로 열려요.</p>
  <input id="wkeyIn" placeholder="Watchmode API 키 (선택)" value="${wkey}">
  <button id="keySave" class="on">저장하고 시작</button>
  <p style="color:var(--sub);font-size:12px">출처: TMDB / JustWatch 제공 시청 가능 정보</p></div>`;
  $('#keySave').onclick=()=>{key=$('#keyIn').value.trim();wkey=$('#wkeyIn').value.trim();if(!key)return;store.set('key',key);store.set('wkey',wkey);init()};
}

async function loadGenres(){
  if(!genreCache[type]){
    const d=await tmdb(`/genre/${type}/list`);genreCache[type]=d.genres;
  }
  const KO={'Action & Adventure':'액션·모험','Kids':'키즈','News':'뉴스','Reality':'리얼리티','Sci-Fi & Fantasy':'SF·판타지','Soap':'연속극','Talk':'토크','War & Politics':'전쟁·정치'};
  const paint=()=>$('#genres').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.g===''?sel.size===0:sel.has(+x.dataset.g)));
  $('#genres').innerHTML='<button data-g="">전체</button>'+genreCache[type].map(g=>`<button data-g="${g.id}">${KO[g.name]||g.name}</button>`).join('');
  $('#genres').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const was=b.dataset.g===''?sel.size===0:sel.has(+b.dataset.g);
    sel.clear();if(b.dataset.g!==''&&!was)sel.add(+b.dataset.g);
    paint();search(true)});
  paint();
}

function params(){
  const p={watch_region:REGION,with_watch_providers:NETFLIX,with_watch_monetization_types:'flatrate',page,
    'vote_count.gte':$('#sort').value==='vote_average.desc'?200:0,
    'vote_average.gte':$('#rate').value,with_origin_country:$('#origin').value,
    with_genres:[...sel].join(',')};
  const s=$('#sort').value;
  if(s==='date.desc'){
    const iso=d=>d.toISOString().slice(0,10), today=new Date(), from=new Date(Date.now()-30*864e5);
    p['vote_count.gte']=0;
    if(type==='movie'){p.sort_by='primary_release_date.desc';p['primary_release_date.lte']=iso(today)}
    else{p.sort_by='popularity.desc';p['air_date.gte']=iso(from);p['air_date.lte']=iso(today)} // 새 시즌·새 에피소드가 최근에 나온 시리즈
  }else p.sort_by=s;
  return p;
}

let seq=0;
async function search(reset){
  const my=++seq;
  if(reset){page=1;items=[];}
  const q=$('#q').value.trim();
  $('#main').innerHTML=items.length?$('#main').innerHTML:'<div class="msg">불러오는 중…</div>';
  try{
    let res;
    if(type==='mine'){return renderMine()}
    if(q){
      // 영화·드라마 구분 없이 검색하고, 한국 넷플릭스에 있는 것만 남긴다
      const d=await tmdb('/search/multi',{query:q,page});
      total=d.total_pages;
      const cand=d.results.filter(r=>r.media_type==='movie'||r.media_type==='tv');
      const checks=await Promise.all(cand.map(async r=>{
        r._t=r.media_type;
        try{const w=await tmdb(`/${r._t}/${r.id}/watch/providers`);
          r._nf=((w.results?.[REGION]?.flatrate)||[]).some(x=>x.provider_id===NETFLIX)}catch{r._nf=false}
        return r}));
      res=checks.filter(r=>r._nf);
      if(res.length<3&&page===1)res=res.concat(checks.filter(r=>!r._nf).slice(0,8).map(r=>({...r,_unk:true})))
    }else{
      const d=await tmdb(`/discover/${type}`,params());
      total=d.total_pages;res=d.results;
    }
    if(my!==seq)return;
    items=items.concat(res);
    render();
  }catch(e){$('#main').innerHTML=`<div class="msg">${e.message}<br><button id="fix">키 다시 설정</button></div>`;$('#fix')?.addEventListener('click',showSetup)}
}

function cardHtml(r,t){
  t=r._t||t;
  const title=r.title||r.name, date=(r.release_date||r.first_air_date||'').slice(0,4);
  const k=t+':'+r.id, m=mine[k];
  return `<div class="card" data-id="${r.id}" data-t="${t}">
    ${r._unk?'<span class="badge" style="top:auto;bottom:46px;background:#a60">넷플릭스 확인 안 됨</span>':''}${r.vote_average?`<span class="badge">⭐ ${r.vote_average.toFixed(1)}</span>`:''}
    ${m?`<span class="mark">${m.s==='seen'?'✅':'⭐'}</span>`:''}
    <img loading="lazy" src="${r.poster_path?IMG+'w185'+r.poster_path:''}" alt="">
    <div class="t">${title}<div class="m">${date}</div></div></div>`;
}
function render(){
  let list=items;
  if($('#hide').value==='1')list=list.filter(r=>mine[(r._t||type)+':'+r.id]?.s!=='seen');
  if(!list.length){$('#main').innerHTML='<div class="msg">조건에 맞는 작품이 없어요.</div>';return}
  $('#main').innerHTML=(list.some(r=>r._unk)?'<div class="msg" style="padding:6px">“확인 안 됨” 표시는 TMDB 정보에 한국 넷플릭스가 없는 작품이에요. 정보가 늦게 갱신되는 경우가 있어서 함께 보여드려요.</div>':'')+`<div class="grid">${list.map(r=>cardHtml(r,type)).join('')}</div>`+
    (page<total?'<button class="more" id="more">더 보기</button>':'<div class="msg">끝</div>');
  bindCards();
  $('#more')?.addEventListener('click',()=>{page++;search(false)});
}
function renderMine(){
  const arr=Object.entries(mine);
  if(!arr.length){$('#main').innerHTML='<div class="msg">아직 비어 있어요.<br>작품을 눌러 ⭐보고싶어요 / ✅봤어요를 추가하세요.</div>';return}
  $('#main').innerHTML=`<div class="grid">${arr.map(([k,m])=>{
    const [t,id]=k.split(':');
    return cardHtml({id,title:m.t,poster_path:m.p,release_date:m.y,vote_average:m.r},t)}).join('')}</div>`;
  bindCards();
}
function bindCards(){document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openDetail(c.dataset.t,c.dataset.id))}

function nfLink(title){
  const q=encodeURIComponent(title), ua=navigator.userAgent;
  if(/Android/i.test(ua))return `intent://www.netflix.com/search?q=${q}#Intent;scheme=https;package=com.netflix.mediaclient;S.browser_fallback_url=${encodeURIComponent('https://www.netflix.com/search?q='+q)};end`;
  if(/iPhone|iPad|iPod/i.test(ua))return `nflx://www.netflix.com/search?q=${q}`;
  return `https://www.netflix.com/search?q=${q}`;
}
function nfAppLink(url){
  const ua=navigator.userAgent;
  if(/Android/i.test(ua))return `intent://${url.replace(/^https?:\/\//,'')}#Intent;scheme=https;package=com.netflix.mediaclient;S.browser_fallback_url=${encodeURIComponent(url)};end`;
  if(/iPhone|iPad|iPod/i.test(ua))return url.replace(/^https?:/,'nflx:');
  return url;
}
async function nfTitleUrl(t,id){
  if(!wkey)return null;
  const cache=store.get('nfmap',{}), k=t+':'+id;
  if(k in cache)return cache[k];
  try{
    const w=p=>fetch('https://api.watchmode.com/v1/'+p+(p.includes('?')?'&':'?')+'apiKey='+wkey).then(r=>{if(!r.ok)throw 0;return r.json()});
    const sr=await w(`search/?search_field=tmdb_${t}_id&search_value=${id}`);
    const wid=sr.title_results?.[0]?.id;
    let url='';
    if(wid){const src=await w(`title/${wid}/sources/?regions=KR`);url=(src.find(x=>x.name==='Netflix'&&/^https?:/.test(x.web_url||''))||{}).web_url||''}
    cache[k]=url;store.set('nfmap',cache);return url;
  }catch{return null}
}
async function openDetail(t,id){
  $('#sheet').innerHTML='<div class="msg">불러오는 중…</div>';$('#modal').classList.add('show');
  try{
    const [d,w]=await Promise.all([tmdb(`/${t}/${id}`),tmdb(`/${t}/${id}/watch/providers`)]);
    const title=d.title||d.name, k=t+':'+id, m=mine[k];
    const onNf=(w.results?.[REGION]?.flatrate||[]).some(x=>x.provider_id===NETFLIX);
    const sub=[(d.release_date||d.first_air_date||'').slice(0,4),
      t==='movie'?(d.runtime?d.runtime+'분':''):(d.number_of_seasons?'시즌 '+d.number_of_seasons+'개':''),
      (d.genres||[]).map(g=>g.name).join(' · ')].filter(Boolean).join(' · ');
    $('#sheet').innerHTML=`${d.backdrop_path?`<img class="bd" src="${IMG}w780${d.backdrop_path}">`:''}
    <div class="b"><h2 id="ttl" style="user-select:all">${title}</h2><div style="color:var(--sub);font-size:13px">${sub}${d.vote_average?` · ⭐ ${d.vote_average.toFixed(1)}`:''}</div>
    <p>${d.overview||'줄거리 정보가 없어요.'}</p>
    <div id="nfStat">${onNf?'✅ 한국 넷플릭스 시청 가능 (TMDB 기준)':'⚠️ TMDB 기준으로 한국 넷플릭스 목록에 없음'}</div>
    <div style="margin-top:8px"><a class="btn" id="nfOpen" target="_blank" rel="noopener" href="${nfLink(title)}">넷플릭스 앱 열기 (제목 복사)</a>
    <a class="btn" style="background:#444" target="_blank" rel="noopener" href="https://www.netflix.com/search?q=${encodeURIComponent(title)}">웹에서 검색</a>
    <button class="btn2" id="nfCopy">제목 복사</button>
    <button class="btn2" id="bWant">${m?.s==='want'?'⭐ 보고싶어요 ✔':'⭐ 보고싶어요'}</button>
    <button class="btn2" id="bSeen">${m?.s==='seen'?'✅ 봤어요 ✔':'✅ 봤어요'}</button>
    <button class="btn2" id="bClose">닫기</button></div></div>`;
    const set=s=>{if(mine[k]?.s===s)delete mine[k];else mine[k]={s,t:title,p:d.poster_path,y:d.release_date||d.first_air_date||'',r:d.vote_average};
      store.set('mine',mine);openDetail(t,id);type==='mine'?renderMine():render()};
    $('#nfOpen').onclick=()=>{copyText(title).then(ok=>toast(ok?'제목 복사됨. 넷플릭스 검색창에 붙여넣으세요':'복사 실패. 위 제목을 길게 눌러 복사하세요'))};
    $('#nfCopy').onclick=()=>copyText(title).then(ok=>toast(ok?'제목 복사됨':'복사 실패. 위 제목을 길게 눌러 복사하세요'));
    nfTitleUrl(t,id).then(u=>{
      if(u===null||!$('#nfOpen'))return;
      if(u===''){$('#nfStat').textContent=onNf?'⚠️ TMDB는 넷플릭스라고 하지만 Watchmode에서는 한국 넷플릭스에 없다고 나와요. 확인이 필요해요.':'⚠️ 한국 넷플릭스에 없는 것으로 확인돼요 (Watchmode)';return}
      $('#nfStat').textContent='✅ 한국 넷플릭스 시청 가능 (Watchmode 확인)';
      $('#nfOpen').href=nfAppLink(u);$('#nfOpen').textContent='넷플릭스 앱에서 바로 열기';$('#nfOpen').onclick=null;
    });
    $('#bWant').onclick=()=>set('want');$('#bSeen').onclick=()=>set('seen');$('#bClose').onclick=close;
  }catch(e){$('#sheet').innerHTML=`<div class="msg">${e.message}</div>`}
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch{}
  try{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;top:0;opacity:0';document.body.appendChild(a);a.focus();a.select();a.setSelectionRange(0,999);const ok=document.execCommand('copy');a.remove();return ok}catch{return false}
}
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#e50914;color:#fff;padding:10px 16px;border-radius:99px;z-index:20;font-size:14px';document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,4000)}
function close(){$('#modal').classList.remove('show')}
$('#modal').onclick=e=>{if(e.target.id==='modal')close()};

function setTab(t){
  type=t;sel.clear();
  $('#tMovie').classList.toggle('on',t==='movie');$('#tTv').classList.toggle('on',t==='tv');$('#tMine').classList.toggle('on',t==='mine');
  if(t==='mine'){$('#genres').innerHTML='';renderMine()}
  else loadGenres().then(()=>search(true));
}
let timer;
function init(){
  if(!key)return showSetup();
  setTab('movie');
}
$('#tMovie').onclick=()=>setTab('movie');
$('#tTv').onclick=()=>setTab('tv');
$('#tMine').onclick=()=>setTab('mine');
['sort','rate','origin','hide'].forEach(i=>$('#'+i).onchange=()=>type==='mine'?renderMine():(i==='hide'?render():search(true)));
$('#q').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>type!=='mine'&&search(true),500)};
$('#keyBtn').onclick=showSetup;
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
</script>
</body>
</html>
